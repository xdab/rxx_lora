name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
          pip install numpy

      - name: Build bin/file_lora
        run: make bin/file_lora

      # Generated frames + AWGN; section 3 (real data/ captures) is local-only
      - name: Regression
        run: python3 tools/regression.py --no-capture

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # .clang-format uses clang-format 22+ keys (BreakAfterOpenBracketFunction
          # et al.), so pin to the version the project is formatted with
          pip install clang-format==23.1.3 ruff

      - name: Style check
        run: make fmt-check

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Headers only: clang-tidy parses (doesn't link); device_rtl.c needs rtl-sdr
          sudo apt-get install -y libfftw3-dev librtlsdr-dev
          # Same LLVM pin as the fmt-check job's clang-format: the version
          # the project is analyzed with
          pip install clang-tidy==23.1.3

      - name: Static analysis
        run: make tidy

  # Portability proof: compile across distros/glibc/musl in containers.
  # Build-only (no regression/fmt/tidy here — the ubuntu jobs above own those).
  # rsp_lora is out of scope: it links the proprietary SDRplay API, which no
  # distro packages (same scope decision as the tidy gate).
  distro-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            install: apt-get update && apt-get install -y gcc make git libfftw3-dev librtlsdr-dev
          - distro: ubuntu:24.04
            install: apt-get update && apt-get install -y gcc make git libfftw3-dev librtlsdr-dev
          - distro: fedora:latest
            install: dnf install -y gcc make git fftw-devel rtl-sdr-devel
          - distro: archlinux
            install: pacman -Sy --noconfirm gcc make git fftw rtl-sdr
          # gcompat/libstdc++: the runner mounts glibc node20 for JS actions,
          # which musl containers can't load without the compat layer
          - distro: alpine:latest
            install: apk add --no-cache build-base git fftw-dev librtlsdr-dev gcompat libstdc++
    container: ${{ matrix.distro }}
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Build
        run: make bin/file_lora bin/rtl_lora

  # Windows portability proof, sibling of distro-build: the UCRT64 toolchain
  # the Makefile's Windows_NT block targets. Regression is the workload, not a
  # second verdict on the code. The dlls target stages the runtime DLLs beside
  # the binary, so the pwsh step runs the gate without ucrt64/bin on PATH —
  # CI then exercises the exact zipped-bin/ distribution story.
  # fmt-check/tidy stay owned by the ubuntu jobs; capture cases (section 3)
  # are local-only there too.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-fftw

      - name: Build bin/file_lora
        shell: msys2 {0}
        run: make file dlls UCRT64_BIN="$(dirname "$(command -v gcc)")"

      - name: Regression
        shell: pwsh
        run: |
          python -m pip install numpy
          python tools/regression.py --bin bin/file_lora.exe --no-capture
