name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
          pip install numpy

      - name: Build bin/file_lora
        run: make bin/file_lora

      # Generated frames + AWGN; section 3 (real data/ captures) is local-only
      - name: Regression
        run: python3 tools/regression.py --no-capture

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # .clang-format uses clang-format 22+ keys (BreakAfterOpenBracketFunction
          # et al.), so pin to the version the project is formatted with
          pip install clang-format==23.1.3 ruff

      - name: Style check
        run: make fmt-check

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Headers only: clang-tidy parses (doesn't link); device_rtl.c needs rtl-sdr
          sudo apt-get install -y libfftw3-dev librtlsdr-dev
          # Same LLVM pin as the fmt-check job's clang-format: the version
          # the project is analyzed with
          pip install clang-tidy==23.1.3

      - name: Static analysis
        run: make tidy

  # Portability proof: compile across distros/glibc/musl in containers.
  # Build-only (no regression/fmt/tidy here — the ubuntu jobs above own those).
  # rsp_lora is out of scope: it links the proprietary SDRplay API, which no
  # distro packages (same scope decision as the tidy gate).
  distro-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            install: apt-get update && apt-get install -y gcc make git libfftw3-dev librtlsdr-dev
          - distro: ubuntu:24.04
            install: apt-get update && apt-get install -y gcc make git libfftw3-dev librtlsdr-dev
          - distro: fedora:latest
            install: dnf install -y gcc make git fftw-devel rtl-sdr-devel
          # librtlsdr is AUR-only on Arch; build rtl-sdr from the osmocom
          # source instead of pulling in an AUR helper
          - distro: archlinux
            install: |
              pacman -Sy --noconfirm gcc make git cmake pkgconf libusb fftw &&
              git clone --depth 1 https://github.com/osmocom/rtl-sdr /tmp/rtl-sdr &&
              cmake -S /tmp/rtl-sdr -B /tmp/rtl-sdr/build -DCMAKE_INSTALL_PREFIX=/usr -DINSTALL_UDEV_RULES=OFF &&
              cmake --build /tmp/rtl-sdr/build --target install &&
              ldconfig
          # gcompat/libstdc++: the runner mounts glibc node20 for JS actions,
          # which musl containers can't load without the compat layer
          - distro: alpine:latest
            install: apk add --no-cache build-base git fftw-dev librtlsdr-dev gcompat libstdc++
    container: ${{ matrix.distro }}
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Build
        run: make bin/file_lora bin/rtl_lora
